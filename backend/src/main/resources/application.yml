server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: touristchain-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/touristchain}
    username: ${DB_USERNAME:touristchain}
    password: ${DB_PASSWORD:touristchain}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,PATCH
      allowed-headers: "*"

logging:
  level:
    com.touristchain: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
