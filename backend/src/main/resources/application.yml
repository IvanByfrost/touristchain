server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: touristchain-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/touristchain}
    username: ${DB_USERNAME:touristchain}
    password: ${DB_PASSWORD:touristchain}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.touristchain: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    com.touristchain: DEBUG
